<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#12355B">
<title>Rom – vom Dorf zum Weltreich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Tokens ===== */
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --surface2:#F5F7FA; --ink:#16212E; --muted:#54627A; --line:#D5DDE8;
  --mare:#12355B; --mare2:#1D4E84; --rot:#C4382C; --gold:#F1B434; --oliv:#4F7B4A;
  --ok:#1B8A4B; --okbg:#E3F5EA; --bad:#B4281E; --badbg:#FDE8E6; --focus:#1D4E84;
  --sea:#BFDFF3; --landc:#EDE6D3; --mapink:#25303F; --halo:#ffffff;
  --paper:#FFFDF6; --paperline:#CFE0F2; --margin:#E58B84;
  --shadow:0 1px 2px rgba(18,53,91,.08),0 6px 20px rgba(18,53,91,.07);
  --r:18px; --hdr:0px;
  --font:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1622; --surface:#152336; --surface2:#1B2C43; --ink:#EAF0F8; --muted:#A5B4C9; --line:#2A3D57;
    --mare:#0A2440; --mare2:#5B9BE0; --okbg:#123524; --ok:#63D68F; --badbg:#3A1714; --bad:#FF8C82; --focus:#8FBEF2;
    --sea:#17324D; --landc:#2C3644; --mapink:#E3EAF4; --halo:#0D1622; --paper:#1A2637; --paperline:#26405F; --margin:#8B4A45;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1622; --surface:#152336; --surface2:#1B2C43; --ink:#EAF0F8; --muted:#A5B4C9; --line:#2A3D57;
  --mare:#0A2440; --mare2:#5B9BE0; --okbg:#123524; --ok:#63D68F; --badbg:#3A1714; --bad:#FF8C82; --focus:#8FBEF2;
  --sea:#17324D; --landc:#2C3644; --mapink:#E3EAF4; --halo:#0D1622; --paper:#1A2637; --paperline:#26405F; --margin:#8B4A45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}

/* ===== Basis ===== */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--hdr) + 12px);-webkit-text-size-adjust:100%}
html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.6;letter-spacing:.005em}
@media (min-width:900px){body{font-size:18px}}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .5em;font-weight:700;letter-spacing:-.005em}
h1{font-size:clamp(1.9rem,5vw,3rem);font-weight:800}
h2{font-size:clamp(1.45rem,3.4vw,2rem)}
h3{font-size:1.2rem}
p{margin:0 0 .8em}
a{color:var(--mare2)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1140px;margin:0 auto;padding:0 16px}

/* ===== Kopfbereich + Zeitstrahl (klebt oben) ===== */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--mare);color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.hdr::after{content:"";display:block;height:6px;background:repeating-linear-gradient(90deg,#F1B434 0 10px,#C4382C 10px 20px,#1D4E84 20px 30px,#EDE6D3 30px 40px)}
.top{display:flex;align-items:center;gap:12px;padding:8px 16px;max-width:1140px;margin:0 auto}
.brand{font-weight:800;font-size:1.05rem;color:#fff;text-decoration:none;white-space:nowrap;display:flex;gap:8px;align-items:center}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin-left:auto}
.pills::-webkit-scrollbar{display:none}
.pills a{color:#fff;text-decoration:none;font-weight:600;font-size:.9rem;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.12);white-space:nowrap;min-height:34px;display:inline-flex;align-items:center}
.pills a[aria-current="page"]{background:var(--gold);color:#1a1a1a}
.tl{max-width:1140px;margin:0 auto;padding:0 16px 8px}
.tl-line{display:flex;align-items:baseline;gap:10px;font-size:.85rem;min-height:1.4em;margin-bottom:22px}
.tl-year{font-weight:800;color:var(--gold);white-space:nowrap}
.tl-what{opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-bar{position:relative;height:22px;border-radius:8px;background:rgba(255,255,255,.14);margin:0 4px}
.tl-zone{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:600;overflow:hidden;white-space:nowrap;color:#fff}
.tl-zone.z1{background:#8E2A22;border-radius:8px 0 0 8px}
.tl-zone.z2{background:#1D6F86}
.tl-zone.z3{background:#5B3FA6}
.tl-zone.z4{background:#4A5568;border-radius:0 8px 8px 0}
.tl-zero{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff;opacity:.9}
.tl-zero span{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:.62rem;white-space:nowrap;margin-top:1px}
.tl-dot{position:absolute;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#fff;opacity:.55;border:0;padding:0;cursor:pointer}
.tl-dot.on{opacity:1;background:var(--gold);width:9px;height:9px;margin:-4.5px 0 0 -4.5px}
.tl-dot::after{content:"";position:absolute;inset:-9px}
.tl-pin{position:absolute;top:-9px;width:0;height:40px;transition:left .6s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:3}
.tl-pin::before{content:"";position:absolute;left:-7px;top:0;width:14px;height:14px;border-radius:50%;background:var(--gold);border:3px solid #fff;box-shadow:0 0 0 0 rgba(241,180,52,.7);animation:ping 2s infinite}
.tl-pin::after{content:"";position:absolute;left:-1px;top:14px;width:2px;height:16px;background:var(--gold)}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(241,180,52,.7)}70%{box-shadow:0 0 0 10px rgba(241,180,52,0)}100%{box-shadow:0 0 0 0 rgba(241,180,52,0)}}
@media (prefers-reduced-motion:reduce){.tl-pin,.tl-pin::before{transition:none;animation:none}}
.tl-scale{position:relative;height:14px;margin:6px 4px 0;font-size:.62rem;opacity:.8}
.tl-scale span{position:absolute;transform:translateX(-50%);white-space:nowrap}
@media (max-width:600px){.brand span.t{display:none}.tl-what{font-size:.78rem}.tl-zone{font-size:.6rem}}

/* ===== Startseite ===== */
.hero{padding:28px 0 8px}
.hero-grid{display:grid;gap:22px;align-items:center}
@media (min-width:920px){.hero-grid{grid-template-columns:5fr 7fr}}
.hero p.lead{font-size:1.15rem;color:var(--muted);max-width:34em}
.hero h1{color:var(--mare);}
:root:not([data-theme="light"]) .hero h1{color:var(--ink)}
.machine{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;border:2px solid var(--mare)}
.mach-ctrl{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.mach-ctrl input[type=range]{flex:1;min-width:140px;accent-color:var(--rot);height:32px}
.mach-txt{margin-top:8px;min-height:3.2em;font-size:.98rem}
.lessons{display:grid;gap:14px;margin:22px 0}
@media (min-width:700px){.lessons{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.lessons{grid-template-columns:repeat(3,1fr)}}
.lcard{display:flex;flex-direction:column;gap:6px;background:var(--surface);border-radius:var(--r);padding:16px 18px 14px;text-decoration:none;color:inherit;box-shadow:var(--shadow);border-top:8px solid var(--c,var(--mare));transition:transform .15s}
.lcard:hover{transform:translateY(-2px)}
.lcard .n{font-size:.85rem;font-weight:700;color:var(--muted)}
.lcard h3{margin:0;font-size:1.15rem}
.lcard p{margin:0;font-size:.95rem;color:var(--muted)}
.lcard .em{font-size:2rem;line-height:1}
.prog{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:auto}
.prog i{display:block;height:100%;background:var(--c,var(--oliv));border-radius:99px;width:0;transition:width .4s}
.lcard small{color:var(--muted)}
.how{display:grid;gap:12px;margin:8px 0 28px}
@media (min-width:800px){.how{grid-template-columns:repeat(3,1fr)}}
.how>div{background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.how b{display:block;margin-bottom:4px}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:12px;border:2px solid var(--mare);background:var(--mare);color:#fff;font-weight:600;text-decoration:none}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--mare2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1a1a}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.92rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.right{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.wrong{background:var(--bad);border-color:var(--bad);color:#fff;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* ===== Stundenseite ===== */
.lesson-head{padding:26px 0 6px}
.lesson-head .kicker{font-weight:700;color:var(--muted);font-size:.95rem}
.lesson-head h1{margin-bottom:.2em}
.jump{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.chapter{margin:26px 0 44px}
.ch-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.ch-ico{width:58px;height:58px;flex:none;border-radius:16px;background:var(--c);display:grid;place-items:center;font-size:1.9rem;box-shadow:var(--shadow)}
.ch-head h2{margin:0}
.ch-head .k{font-size:.9rem;font-weight:700;color:var(--muted)}
.goals{background:var(--surface);border-radius:var(--r);padding:12px 18px;box-shadow:var(--shadow);border-left:8px solid var(--c);margin-bottom:16px}
.goals b{display:block;margin-bottom:2px}
.goals ul{margin:0;padding-left:1.2em}
.sec-title{display:flex;align-items:center;gap:10px;margin:30px 0 12px}
.sec-title::after{content:"";flex:1;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--c) 0 10px,transparent 10px 16px);opacity:.5}

/* ===== Zeitreise (Karte + Text) ===== */
.zr{display:grid;gap:14px}
@media (min-width:980px){.zr{grid-template-columns:7fr 5fr;align-items:start}.zr-map{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr) + 12px)}}
.map-wrap{position:relative;background:var(--sea);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:2px solid var(--line)}
.map-svg{display:block;width:100%;height:auto;aspect-ratio:3/2;user-select:none}
.m-sea{fill:var(--sea)}
.m-landp{fill:var(--landc)}
.m-reg{stroke:#fff;stroke-opacity:.75;stroke-width:1.2px;vector-effect:non-scaling-stroke;fill-opacity:.94;transition:fill .5s}
.m-reg.new,.m-kp.new{stroke:#111;stroke-opacity:1;stroke-width:3px;animation:glow 1.3s ease-in-out infinite alternate}
:root[data-theme="dark"] .m-reg.new{stroke:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .m-reg.new,:root:not([data-theme="light"]) .m-kp.new{stroke:#fff}}
@keyframes glow{from{fill-opacity:.6}to{fill-opacity:1}}
@media (prefers-reduced-motion:reduce){.m-reg.new,.m-kp.new{animation:none}}
.m-kp{stroke:#fff;stroke-opacity:.75;stroke-width:1.2px;vector-effect:non-scaling-stroke;fill-opacity:.94}
.m-limes{fill:none;stroke:#1e3a8a;stroke-width:3px;stroke-dasharray:2 5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.m-lab{fill:var(--mapink);opacity:.55;font-family:var(--font);font-weight:500;paint-order:stroke;stroke:var(--halo);stroke-linejoin:round}
.m-lab.sea{font-style:italic;fill:#2f6fa0;opacity:.8}
.m-city text{fill:var(--mapink);font-family:var(--font);font-weight:700;paint-order:stroke;stroke:var(--halo);stroke-linejoin:round}
.m-city circle{fill:#fff;stroke:#111;stroke-width:2px;vector-effect:non-scaling-stroke}
.m-route{fill:none;stroke-width:3.5px;stroke-dasharray:9 7;stroke-linecap:round;vector-effect:non-scaling-stroke;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.m-route{animation:none}}
.m-rlab{font-family:var(--font);font-weight:700;paint-order:stroke;stroke:var(--halo);stroke-linejoin:round}
.m-pick{cursor:pointer}
.m-pick circle{fill:var(--gold);stroke:#111;stroke-width:2px;vector-effect:non-scaling-stroke}
.m-pick text{font-family:var(--font);font-weight:800;fill:#111;text-anchor:middle;dominant-baseline:central}
.m-pick:hover circle,.m-pick:focus circle{fill:#fff}
.m-pick.right circle{fill:#4ade80}.m-pick.wrong circle{fill:#f87171}
.map-badge{position:absolute;left:10px;top:10px;background:rgba(18,53,91,.92);color:#fff;border-radius:12px;padding:4px 12px;font-weight:800;font-size:1.05rem;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.map-tools{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.map-tools button{border:0;background:rgba(255,255,255,.94);color:#111;border-radius:10px;min-height:34px;padding:0 10px;font-size:.85rem;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 4px 0;font-size:.85rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:16px;border-radius:5px;border:1px solid rgba(0,0,0,.25);flex:none}
.legend b.neu{background:#111;color:#fff;border-radius:6px;padding:0 6px;font-size:.7rem}
:root[data-theme="dark"] .legend b.neu{background:#fff;color:#111}
.step-card{background:var(--surface);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);border-top:8px solid var(--c)}
.pins{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pin{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface2);font-weight:700;font-size:.9rem;display:grid;place-items:center}
.pin.seen{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.pin.on{background:var(--c);border-color:var(--c);color:#fff;transform:scale(1.12)}
.year-pill{display:inline-block;background:var(--mare);color:#fff;font-weight:800;padding:2px 14px;border-radius:999px;font-size:1.05rem;margin-bottom:6px}
.step-card h3{margin-bottom:.35em}
.step-body p{margin:0 0 .7em}
.step-body ul{margin:0 0 .8em;padding-left:1.2em}
.step-body li{margin-bottom:.25em}
.fact{background:color-mix(in srgb,var(--gold) 22%,var(--surface));border-radius:12px;padding:8px 12px;font-size:.95rem;margin:8px 0}
.step-nav{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.step-nav .sp{flex:1}
.term{border-bottom:2px dotted var(--rot);cursor:help;font-weight:600}
.pop{position:absolute;z-index:200;max-width:min(300px,calc(100vw - 16px));background:#111;color:#fff;padding:8px 12px;border-radius:10px;font-size:.9rem;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,.4)}

/* ===== Material ===== */
.mat{display:grid;gap:14px;margin-top:16px}
@media (min-width:900px){.mat.two{grid-template-columns:1fr 1fr}}
.info{background:var(--surface);border-radius:var(--r);padding:14px 18px;box-shadow:var(--shadow);border-left:8px solid var(--gold)}
.info h4{margin:0 0 .3em;font-size:1.05rem}
.info p:last-child,.info ul:last-child{margin-bottom:0}
.source{background:var(--surface2);border-radius:var(--r);padding:14px 18px 12px 22px;border:2px dashed var(--line);position:relative}
.source::before{content:"“";position:absolute;left:8px;top:-4px;font-size:3rem;color:var(--rot);font-weight:800}
.source cite{display:block;font-size:.88rem;color:var(--muted);font-style:normal;margin-top:6px}
.compare{display:grid;gap:12px}
@media (min-width:700px){.compare{grid-template-columns:1fr 1fr}}
.compare>div{background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.compare>div:first-child{border-top:8px solid var(--rot)}
.compare>div:last-child{border-top:8px solid var(--mare2)}
.compare h4{margin:0 0 .4em}.compare ul{margin:0;padding-left:1.2em}
.chain{background:var(--surface);border-radius:var(--r);padding:14px 18px;box-shadow:var(--shadow)}
.chain-list{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.chain-item{display:flex;gap:12px;align-items:center;background:var(--surface2);border-radius:14px;padding:8px 14px;animation:pop .35s}
.chain-item .ic{font-size:1.6rem}
.chain-arrow{text-align:center;color:var(--rot);font-weight:800;line-height:1}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.story{background:var(--paper);border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow);border:2px solid var(--line)}
.story p{margin-bottom:.6em}
.figure{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.figure .fig{flex:1 1 130px;text-align:center;background:var(--surface2);border-radius:14px;padding:10px 8px;font-size:.92rem}
.figure .fig .big{font-size:2.2rem;line-height:1.1;display:block}

/* ===== Aufgaben ===== */
.tasks{display:grid;gap:16px}
.task{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;border:2px solid transparent}
.task.solved{border-color:var(--ok)}
.t-head{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--surface2);font-size:.9rem}
.t-num{font-weight:800}
.t-type{color:var(--muted);flex:1}
.t-star{filter:grayscale(1);opacity:.35;font-size:1.3rem;transition:all .3s}
.t-star.on{filter:none;opacity:1;transform:scale(1.2)}
.t-body{padding:14px 16px 8px}
.q{font-weight:600;margin-bottom:.7em}
.fb{margin:10px 16px 14px;padding:8px 12px;border-radius:12px;font-size:.98rem;display:none}
.fb.ok{display:block;background:var(--okbg);color:var(--ok)}
.fb.bad{display:block;background:var(--badbg);color:var(--bad)}
.fb.info{display:block;background:var(--surface2);color:var(--ink)}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);min-height:46px}
.opt:hover:not([disabled]){border-color:var(--mare2)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);opacity:.7}
.opts.locked .opt:not(.right){opacity:.55;pointer-events:none}
.tf-row{display:grid;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}
.tf-row:last-child{border:0}
.tf-btns{display:flex;gap:8px;flex-wrap:wrap}
.tf-note{font-size:.92rem;color:var(--ok);min-height:1em}
.tf-row.done .tf-q{color:var(--ok);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{padding:8px 14px;border-radius:12px;border:2px solid var(--mare2);background:var(--surface);min-height:42px;text-align:left}
.chip:hover{background:var(--surface2)}
.chip.sel{background:var(--gold);border-color:var(--gold);color:#111}
.slots{list-style:none;margin:8px 0;padding:0;display:grid;gap:8px;counter-reset:s}
.slot{counter-increment:s;display:flex;align-items:center;gap:10px;min-height:48px;border:2px dashed var(--line);border-radius:12px;padding:4px 8px}
.slot::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--mare);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;font-size:.9rem}
.slot.ok{border:2px solid var(--ok);background:var(--okbg)}
.slot.no{border:2px solid var(--bad);background:var(--badbg)}
.slot .chip{border-color:transparent;background:transparent;padding:4px 6px;flex:1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 10px}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
@media (max-width:520px){.mcols{gap:8px 8px}}

        'Nach und nach wurde Rom zu einer [[Republik|Das Wort kommt von „res publica“ = „Sache des Volkes“. Gewählte Männer regieren, kein König.]].',

    { y: -509, t: 'Wer regiert in der Republik?', s: 'Konsuln und Senat', view: [12.4, 41.9, 12], pulse: [],
      txt: ['Zwei [[Konsuln|Die beiden obersten Beamten Roms. Sie wurden für ein Jahr gewählt.]] leiten den Staat. Sie werden nur für ein Jahr gewählt.',

let page = '', pending = null;
const allTasks = chs => chs.reduce((n, c) => n + c.tasks.length, 0);
const doneTasks = chs => chs.reduce((n, c) => n + c.tasks.filter((t, k) => Store.solved(c.id + '-t' + (k + 1))).length, 0);

function chapterEl(ch) {
  const sec = h('section', { class: 'chapter', id: ch.id, style: '--c:' + ch.color, 'aria-labelledby': 'h-' + ch.id });
  sec.append(h('div', { class: 'ch-head' }, h('div', { class: 'ch-ico', 'aria-hidden': 'true' }, ch.emoji), h('div', null, h('div', { class: 'k' }, ch.kicker || ''), h('h2', { id: 'h-' + ch.id }, ch.title))));
  sec.append(h('div', { class: 'goals' }, h('b', null, '🎯 Das kannst du danach'), h('ul', null, ch.goals.map(g => h('li', null, g)))));
  const pre = (ch.material || []).filter(m => m.pre), mat = (ch.material || []).filter(m => !m.pre);
  if (pre.length) {
    sec.append(h('h3', { class: 'sec-title' }, '⏳ Zuerst: ' + (pre[0].title || 'Einstieg')));
    sec.append(h('div', { class: 'mat' }, pre.map(m => materialEl({ ...m, title: null }))));
  }
  if (ch.steps && ch.steps.length) {
    sec.append(h('h3', { class: 'sec-title' }, '🗺️ Zeitreise'));
    sec.append(Zeitreise(ch).root);
  }
  if (mat.length) {
    sec.append(h('h3', { class: 'sec-title' }, '📚 Material'));
    sec.append(h('div', { class: 'mat' + (mat.length === 2 ? ' two' : '') }, mat.map(materialEl)));
  }
  sec.append(h('h3', { class: 'sec-title' }, '💻 Aufgaben am Bildschirm'));
  sec.append(h('div', { class: 'tasks' }, ch.tasks.map((t, k) => taskCard(ch, k, t))));
  if (ch.finale) sec.append(ch.finale(ch));
  if (ch.heft && ch.heft.length) {
    sec.append(h('h3', { class: 'sec-title' }, '✏️ Heftaufgaben'));
    ch.heft.forEach((hf, k) => {
      const id = ch.id + '-h' + (k + 1);
      const cb = h('input', { type: 'checkbox', id: 'cb-' + id });
      cb.checked = Store.heft(id);
      cb.addEventListener('change', () => Store.setHeft(id, cb.checked));
      sec.append(h('div', { class: 'heft-card' }, h('span', { class: 'pen', 'aria-hidden': 'true' }, '✏️'), h('p', { html: rich(hf) }), h('label', { for: 'cb-' + id }, cb, 'Erledigt')));
    });
  }
  if (ch.entry) {
    sec.append(h('h3', { class: 'sec-title' }, '📒 Hefteintrag'));
    sec.append(h('div', { class: 'entry' }, h('h4', null, ch.entry.title), h('p', { class: 'hint' }, 'Schreibe diesen Merkkasten ins Heft.'), h('ul', null, ch.entry.items.map(x => h('li', { html: rich(x) })))));
  }
  return sec;
}

function teacherEl(l) {
  const d = h('details', { class: 'teacher' }, h('summary', null, '🧑‍🏫 Für Lehrkräfte'));
  chaptersOf(l).forEach(c => {
    if (!c.teacher) return;
    d.append(h('h4', null, c.title + ' – Stundenverlauf'), h('ul', null, c.teacher.plan.map(p => h('li', null, h('b', null, p[0] + ': '), p[1]))));
    if (c.teacher.sol && c.teacher.sol.length) d.append(h('h4', null, 'Lösungsvorschläge zu den Heftaufgaben'), h('ul', null, c.teacher.sol.map(x => h('li', { html: rich(x) }))));
    if (c.teacher.diff && c.teacher.diff.length) d.append(h('h4', null, 'Differenzierung'), h('ul', null, c.teacher.diff.map(x => h('li', { html: rich(x) }))));
  });
  d.append(h('h4', null, 'Hinweise'), h('ul', null, h('li', null, 'Die Kartengrenzen sind vereinfacht. Sie zeigen Gebiete, keine genauen Grenzlinien.'), h('li', null, 'Bei unsicheren Jahren steht „um“ (z. B. Gründung Roms 753 v. Chr. = Sage).'), h('li', null, 'Der Fortschritt wird nur im Browser dieses Geräts gespeichert (kein Login, kein Tracking).')));
  return d;
}

function lessonPage(n) {
  const l = LESSONS[n - 1], chs = chaptersOf(l);
  const frag = document.createDocumentFragment();
  const stars = h('span', { class: 'stars' });
  const upd = () => { stars.textContent = '⭐ ' + doneTasks(chs) + ' von ' + allTasks(chs) + ' Aufgaben'; };
  upd();
  const head = h('header', { class: 'lesson-head' }, h('div', { class: 'kicker' }, 'Stunde ' + n + ' · 45 Minuten · ', stars), h('h1', null, l.emoji + ' ' + l.title),
    h('div', { class: 'jump', role: 'group', 'aria-label': 'Springe zum Kapitel' }, chs.map(c => h('button', { type: 'button', class: 'btn ghost sm', onclick: () => $('#' + c.id).scrollIntoView({ behavior: rmotion() ? 'auto' : 'smooth', block: 'start' }) }, c.emoji + ' ' + c.title))));
  frag.append(head);
  chs.forEach(c => frag.append(chapterEl(c)));
  frag.append(h('div', { class: 'mosaic' }));
  frag.append(teacherEl(l));
  frag.append(h('nav', { class: 'foot', 'aria-label': 'Stunden wechseln' },
    n > 1 ? h('a', { class: 'btn ghost', href: '#std' + (n - 1) }, '◀ Stunde ' + (n - 1) + ': ' + LESSONS[n - 2].title) : h('a', { class: 'btn ghost', href: '#start' }, '◀ Startseite'),
    n < 6 ? h('a', { class: 'btn', href: '#std' + (n + 1) }, 'Stunde ' + (n + 1) + ': ' + LESSONS[n].title + ' ▶') : h('a', { class: 'btn', href: '#start' }, '🏠 Zur Startseite')));
  page.upd.push(upd);
  return frag;
}

const KEYS = [
  [-753, 'Nach der Sage gründet Romulus die Stadt Rom am Tiber.'],
  [-509, 'Die Könige sind weg. Rom wird eine Republik mit zwei Konsuln.'],
  [-338, 'Rom besiegt die Latiner. Latium gehört nun zu Rom.'],
  [-290, 'Nach langen Kriegen gegen die Samniten gehört Mittelitalien zu Rom.'],
  [-272, 'Tarent fällt. Rom beherrscht jetzt Süditalien.'],
  [-241, 'Rom gewinnt Sizilien. Das ist die erste Provinz außerhalb Italiens.'],
  [-206, 'Rom vertreibt die Karthager aus Spanien.'],
  [-146, 'Karthago wird zerstört. Auch Griechenland wird römisch.'],
  [-121, 'Südgallien wird römisch. Der Weg nach Spanien ist nun sicher.'],
  [-63, 'Pompeius ordnet den Osten. Syrien und Kleinasien kommen zu Rom.'],
  [-30, 'Ägypten wird römisch. Octavian ist nun der Herr im Mittelmeer.'],
  [117, 'Unter Kaiser Trajan ist das Reich am größten.'],
  [395, 'Das Reich wird geteilt: Westrom (blau) und Ostrom (orange).'],
  [476, 'Der letzte Kaiser im Westen wird abgesetzt. Westrom ist zu Ende.']
];
function startPage() {
  const frag = document.createDocumentFragment();
  const map = makeMap({ tools: false });
  const txt = h('p', { class: 'mach-txt', 'aria-live': 'polite' });
  const rng = h('input', { type: 'range', min: 0, max: KEYS.length - 1, step: 1, value: 0, 'aria-label': 'Schlüsseljahr wählen' });
  const play = h('button', { type: 'button', class: 'btn gold', 'aria-label': 'Abspielen' }, '▶ Abspielen');
  let idx = 0, timer = null;
  const show = (k, animate) => {
    idx = k; const [y, tx] = KEYS[k];
    map.set({ year: y, view: FULL, marks: [], prev: k ? KEYS[k - 1][0] : y - 1 }, animate);
    txt.innerHTML = '<b>' + fy(y) + ':</b> ' + esc(tx); rng.value = k;
    setCurrent(null, 0, y, tx);
  };
  const stop = () => { clearInterval(timer); timer = null; play.textContent = '▶ Abspielen'; play.setAttribute('aria-label', 'Abspielen'); };
  const go = () => { if (idx >= KEYS.length - 1) { stop(); return; } show(idx + 1, true); if (idx >= KEYS.length - 1) stop(); };
  play.onclick = () => { if (timer) { stop(); return; } if (idx >= KEYS.length - 1) show(0, true); play.textContent = '⏸ Pause'; play.setAttribute('aria-label', 'Pause'); timer = setInterval(go, 3200); };
  rng.oninput = () => { stop(); show(+rng.value, true); };
  page.stopTimer = stop;
  frag.append(h('section', { class: 'hero' }, h('div', { class: 'hero-grid' },
    h('div', null, h('h1', null, 'Rom – vom Dorf zum Weltreich'), h('p', { class: 'lead' }, 'Wie wurde aus ein paar Hütten am Fluss die größte Macht der Antike? Reise in 6 Stunden durch über 1200 Jahre.'), h('p', { class: 'lead' }, 'Schau dir rechts die Zeitmaschine an. Drücke auf Abspielen!')),
    h('div', { class: 'machine' }, h('h2', { class: 'sr' }, 'Zeitmaschine'), map.root, h('div', { class: 'mach-ctrl' }, play, rng), txt))));
  show(0, false);
  const all = ALL_CH();
  frag.append(h('h2', { class: 'sec-title', style: '--c:var(--rot)' }, '📅 Die 6 Stunden'));
  frag.append(h('div', { class: 'lessons' }, LESSONS.map(l => {
    const chs = chaptersOf(l), i = h('i'), sm = h('small');
    const upd = () => { const a = allTasks(chs), d = doneTasks(chs); i.style.width = (a ? d / a * 100 : 0) + '%'; sm.textContent = d + ' von ' + a + ' Aufgaben gelöst'; };
    upd(); page.upd.push(upd);
    return h('a', { class: 'lcard', href: '#std' + l.n, style: '--c:' + chs[0].color }, h('span', { class: 'em', 'aria-hidden': 'true' }, l.emoji), h('span', { class: 'n' }, 'Stunde ' + l.n), h('h3', null, l.title), h('p', null, l.blurb), h('div', { class: 'prog', role: 'presentation' }, i), sm);
  })));
  frag.append(h('h2', { class: 'sec-title', style: '--c:var(--mare2)' }, '🧭 So arbeitest du'));
  frag.append(h('div', { class: 'how' },
    h('div', null, h('b', null, '💻 Aufgabe am Bildschirm'), 'Tippe oder klicke. Du bekommst sofort eine Rückmeldung. Fehler sind okay – du kannst es immer neu versuchen. Für jede gelöste Aufgabe gibt es einen ⭐.'),
    h('div', null, h('b', null, '✏️ Heftaufgabe'), 'Diese Aufgabe schreibst du in dein Heft. Setze danach das Häkchen bei „Erledigt“. Am Ende jedes Kapitels gibt es einen Hefteintrag zum Abschreiben.'),
    h('div', null, h('b', null, '📖 Wort anklicken'), 'Unterstrichene Wörter mit roter Punktlinie kannst du anklicken. Dann siehst du eine Erklärung.'),
    h('div', null, h('b', null, '🔊 Vorlesen'), 'In der Zeitreise kann dir der Computer die Station vorlesen (wenn dein Gerät das kann).')));
  frag.append(h('p', { class: 'foot-note' }, h('button', { type: 'button', class: 'btn ghost sm', onclick: () => { if (confirm('Willst du deinen ganzen Fortschritt löschen?')) { Store.reset(); } } }, '🗑️ Fortschritt löschen')));
  return frag;
}

function quizFinale(ch) {
  const chs = ALL_CH().filter(c => c.tasks.length);
  const b = h('div', { class: 'done-banner', role: 'status', 'aria-live': 'polite' });
  const upd = () => {
    const a = allTasks(chs), d = doneTasks(chs), q = ch.tasks.every((t, k) => Store.solved(ch.id + '-t' + (k + 1)));
    b.textContent = (q ? '🏆 Du bist jetzt Rom-Profi! ' : 'Noch ein paar Quiz-Aufgaben bis zum Rom-Profi. ') + '⭐ ' + d + ' von ' + a + ' Sternen gesammelt.';
    b.classList.toggle('won', q);
  };
  upd(); page.upd.push(upd);
  return b;
}

/* ===== Router ===== */
function setNav(cur) {
  $$('.pills a').forEach(a => {
    if (a.getAttribute('href') === '#' + cur) {
      a.setAttribute('aria-current', 'page');
      const box = a.parentNode; if (box && box.clientWidth) box.scrollLeft = a.offsetLeft - box.clientWidth / 2 + a.offsetWidth / 2;
    } else a.removeAttribute('aria-current');
  });
}
function route() {
  if (page && page.stopTimer) page.stopTimer();
  Speech.stop(); closePop();
  const hsh = (location.hash || '#start').slice(1);
  const m = /^std([1-6])$/.exec(hsh);
  const name = m ? hsh : 'start';
  page = { name, upd: [] };
  Object.keys(ZR).forEach(k => delete ZR[k]);
  const root = main(); root.replaceChildren();
  if (m) { root.append(lessonPage(+m[1])); document.title = 'Stunde ' + m[1] + ': ' + LESSONS[+m[1] - 1].title + ' – Rom'; observeZR(); const first = Object.values(ZR)[0]; if (first) first.publish(); else setCurrent(null, 0, Cur.year, Cur.what, Cur.yl); }
  else { root.append(startPage()); document.title = 'Rom – vom Dorf zum Weltreich'; if (IO) { IO.disconnect(); IO = null; } }
  setNav(name);
  try { window.scrollTo(0, 0); } catch (e) { /* ältere Umgebungen */ }
  if (pending && ZR[pending.ch]) {
    const p = pending; pending = null;
    ZR[p.ch].show(p.step, false, true);
    setTimeout(() => ZR[p.ch] && ZR[p.ch].root.scrollIntoView({ block: 'start' }), 30);
  }
  main().focus && main().focus({ preventScroll: true });
}
function goStation(chId, stepIdx) {
  const l = lessonOf(chId);
  if (page.name !== 'std' + l.n) { pending = { ch: chId, step: stepIdx }; location.hash = '#std' + l.n; return; }
  const z = ZR[chId]; z.show(stepIdx, true, true);
  z.root.scrollIntoView({ behavior: rmotion() ? 'auto' : 'smooth', block: 'start' });
}

function measureHdr() { const hd = $('.hdr'); if (hd) document.documentElement.style.setProperty('--hdr', hd.offsetHeight + 'px'); }
function init() {
  const app = $('#app');
  const pills = h('nav', { class: 'pills', 'aria-label': 'Seiten' }, h('a', { href: '#start' }, '🏠 Start'), LESSONS.map(l => h('a', { href: '#std' + l.n, title: l.title }, l.emoji + ' Std. ' + l.n)));
  const hdr = h('header', { class: 'hdr' }, h('div', { class: 'top' }, h('a', { class: 'brand', href: '#start' }, '🏛️ ', h('span', { class: 't' }, 'Rom – vom Dorf zum Weltreich')), pills), buildTimeline());
  app.append(hdr, h('main', { id: 'main', tabindex: '-1', class: 'wrap' }), h('footer', { class: 'site' }, 'Lern-Website Gesellschaftslehre Klasse 6 · Kartengrenzen sind vereinfacht · Kein Login, kein Tracking'));
  document.addEventListener('rom-progress', () => page && page.upd && page.upd.forEach(f => f()));
  window.addEventListener('hashchange', route);
  window.addEventListener('resize', measureHdr);
  route(); measureHdr();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureHdr);
  setTimeout(measureHdr, 300);
}
init();

</script>
